# cargo-deny: the licence gate (plan section 6) plus sources and advisories.
#
#   cargo deny check licenses sources bans
#
# The desktop app is its own workspace with its own config: apps/desktop/deny.toml.
#
# Everything we ship is MIT OR Apache-2.0, so every dependency must carry a permissive
# licence. No GPL, LGPL, AGPL, SSPL or other copyleft-on-linking licence is allowed, ever: a
# crate that needs one is refused, not excepted (libsignal, x264 and Zed's GPL editor crates
# are the known cases). MPL-2.0 is file-level copyleft (a binary may link it under any licence
# as long as the MPL files' source stays available, which crates.io provides): it is allowed
# only for named crates in `exceptions` (today: three, all pulled in by GPUI, in
# apps/desktop/deny.toml), never for our own code.
#
# The one other exception is `sqlcipher-src` (see `exceptions` below): public-domain
# dedications that are not on the general allow-list.
#
# C libraries linked from the system (libvpx) are not crates
# and are not seen here: their licences are recorded in docs/m0-spike.md and THIRD_PARTY.md
# lands with packaging in M1. C code compiled from crates is seen through the crate's
# licence: SQLCipher (BSD-3-Clause) and, off Apple systems, the OpenSSL libcrypto it uses
# (Apache-2.0, `openssl-src`), both for at-rest storage in parolnet-store.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# SQLCipher's source (parolnet-store, through libsqlite3-sys). SQLCipher is BSD-3-Clause; the
# SQLite code inside it is public domain under SQLite's "blessing"; the crate also ships
# libtomcrypt (public domain / WTFPL), its crypto provider for wasm, which no native build
# compiles. Both are permissive with no copyleft, and are allowed for this crate only.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
version = 2
