name: CI

# PROBE BRANCH (never merged): the 300 kbit/s cap profile, 8 seeds, run twice, on each engine
# revision of train 13 between master 81e2253e and df82663c. Only this job runs here.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    name: m1 300k sweep @ ${{ matrix.rev }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rev:
          - 81e2253e1672d22f90ba0ffaf25aeb0ef8f2fa2c
          - cd69d5043c5e1ca05da28a0ecb56cdc96272f1f3
          - 95fb09a4ecbe8ee0a249c0700c627f48640bd1f0
          - dfc9561f9fc8afbfd15a64fe85be5afc04108fa8
          - 2dcf2689e4e75d72a6b3a233e12df5de4b196068
          - fd0943cc5d4a3cc9c95ad89729770d92d90dfcbe
          - 0391c4c8dfe13820cd8a3d3b76ce596e7c881d82
          - 3829ab365336f4df4abdd7a7abafdeec9ecfae8e
          - ae77304571c71f9ecfd5ffa6617fa28eb7c84617
          - 5ea96f81a1e93fc8778c0b4a669e4c267835546e
          - 5c209231d6effaca558070879a36184e69ed2ad6
          - 737507c9c592a75be0b5f06e1faed916cdc4eacd
          - df82663c6ca0a346e485b6ea79025c793a43f9a8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-probe-${{ matrix.rev }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Pin the engine to ${{ matrix.rev }}
        run: |
          sed -i -E 's|^rtc = \{ git = "([^"]+)", rev = "[0-9a-f]+" \}|rtc = { git = "\1", rev = "${{ matrix.rev }}" }|' Cargo.toml
          grep '^rtc = ' Cargo.toml
          grep -q '${{ matrix.rev }}' Cargo.toml
          cargo update -p rtc
      - name: Sweep, run 1
        run: cargo test -p parolnet-simnet --test m1 -- --ignored --nocapture sweep_profile_300_kbps_cap
      - name: Sweep, run 2
        run: cargo test -p parolnet-simnet --test m1 -- --ignored --nocapture sweep_profile_300_kbps_cap
      - name: The non-ignored profile test as the PR runs it (3 seeds, asserting)
        if: ${{ !cancelled() }}
        run: cargo test -p parolnet-simnet --test m1 -- --nocapture --test-threads=1 profile_300_kbps_cap
