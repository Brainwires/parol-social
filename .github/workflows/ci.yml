name: CI

# PROBE BRANCH (never merged): m1 cap-length sweep (the cap held 14, 17, 20, 23, 26 s after the
# estimate went under 400 kbit/s), three runs in separate processes per cell, on engine master
# 4431dda0 and conf/gcc-4-release e64698e5 under the default NACK rule and UpToTarget; the
# branch also with a per-connection wall clock. Only this job runs here.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  cap-length:
    name: cap length @ ${{ matrix.rev }} ${{ matrix.upto && 'UpToTarget' || 'default' }}${{ matrix.wallclock && ' wallclock' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rev: 4431dda0dc88dfb5ccefd079e256bbf5d238a0d0, upto: false, wallclock: false }
          - { rev: 4431dda0dc88dfb5ccefd079e256bbf5d238a0d0, upto: true, wallclock: false }
          - { rev: e64698e5b9e5d152a6d5b17cd4b3428ed559a176, upto: false, wallclock: false }
          - { rev: e64698e5b9e5d152a6d5b17cd4b3428ed559a176, upto: true, wallclock: false }
          - { rev: e64698e5b9e5d152a6d5b17cd4b3428ed559a176, upto: false, wallclock: true }
          - { rev: e64698e5b9e5d152a6d5b17cd4b3428ed559a176, upto: true, wallclock: true }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-probe-caplen-${{ matrix.rev }}-${{ matrix.upto }}-${{ matrix.wallclock }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Pin the engine to ${{ matrix.rev }}
        run: |
          sed -i -E 's|^rtc = \{ git = "([^"]+)", rev = "[0-9a-f]+" \}|rtc = { git = "\1", rev = "${{ matrix.rev }}" }|' Cargo.toml
          grep -q '${{ matrix.rev }}' Cargo.toml
          cargo update -p rtc
      - name: UpToTarget build switch
        if: ${{ matrix.upto }}
        run: echo "PAROLNET_PROBE_NACK_UP_TO_TARGET=1" >> "$GITHUB_ENV"
      - name: Wall clock per connection
        if: ${{ matrix.wallclock }}
        run: echo "RUSTFLAGS=--cfg parolnet_probe_wall_clock" >> "$GITHUB_ENV"
      - name: Sweep, run 1
        run: cargo test -p parolnet-simnet --test m1 -- --ignored --nocapture --exact sweep_cap_length
      - name: Sweep, run 2
        if: ${{ !cancelled() }}
        run: cargo test -p parolnet-simnet --test m1 -- --ignored --nocapture --exact sweep_cap_length
      - name: Sweep, run 3
        if: ${{ !cancelled() }}
        run: cargo test -p parolnet-simnet --test m1 -- --ignored --nocapture --exact sweep_cap_length
