name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      - run: cargo check --workspace

  deny:
    name: Licence gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # No GPL / LGPL / AGPL anywhere; MPL-2.0 only for the crates deny.toml names. Advisories are
      # not gated here yet (the existing tree carries known ones: see IMPLEMENTATION_STATUS.md).
      - name: Workspace
        run: cargo deny check licenses sources bans
      - name: Desktop app (its own workspace)
        run: cargo deny --manifest-path apps/desktop/Cargo.toml --config apps/desktop/deny.toml check licenses sources bans

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build crates/parolnet-wasm --target web

  conformance:
    name: Spec Conformance (clauses + vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-conformance-
      - name: Conformance test suite
        run: cargo test -p parolnet-conformance
      - name: Spec-clause coverage report
        # `--check` will be added here once Phase 2 reaches 100% MUST coverage.
        # See FEDERATION-IMPLEMENTATION.md + specs/SPEC-INDEX.md for progress.
        run: cargo xtask clauses
      - name: Test-vector validity
        run: cargo xtask vectors --validate

  pwa-interop:
    name: Desktop <-> PWA interop (headless Chromium)
    # The headless desktop core (parolnet-app's bot) against the real PWA in Chromium through
    # the relay binary in its signaling-only profile: pairing both ways, chat both ways, the
    # sender queue. Twice: as Chromium ships (mDNS host candidates the desktop resolves) and
    # with loopback candidates.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-interop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-interop-
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Chromium (puppeteer) and esbuild
        run: npm ci
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the PWA
        run: npm run build:wasm && npm run build
      - name: Build the relay and the desktop bot
        run: cargo build -p parolnet-relay-server --bin parolnet-relay -p parolnet-app --example bot
      - name: Interop (mDNS host candidates)
        run: INTEROP_ICE=mdns node apps/desktop/interop/pwa-interop.mjs
      - name: Interop (loopback host candidates)
        run: INTEROP_ICE=loopback node apps/desktop/interop/pwa-interop.mjs

  web:
    name: Web app (Denext; unit tests, export, Chromium / Firefox / WebKit)
    # web/: the Denext rewrite of the PWA. Builds the wasm core, lints, type-checks, runs the
    # unit tests, exports the static site and drives it in three browsers under /pwa/ with the
    # production Content-Security-Policy.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Denext
        run: |
          curl -fsSL https://denext.dev/install.sh | sh
          echo "$HOME/.denext/bin" >> "$GITHUB_PATH"
      - name: Install Denext's runtime
        run: denext runtime install
      - name: Build the wasm core
        run: denext task build-wasm
      - name: Lint, format, type-check
        run: denext task lint && denext task fmt:check && denext task check
      - name: Unit tests
        run: denext task test
      - name: Export the static site
        run: denext task build
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Playwright and its browsers
        working-directory: web/tests/e2e
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        working-directory: web/tests/e2e
        run: npx playwright test
      - name: Upload screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e
          path: |
            web/tests/e2e/artifacts/
            web/tests/e2e/playwright-report/
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.91.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - run: cargo check --workspace

  reproducible:
    name: Reproducible Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build artifacts
        run: |
          mkdir -p dist
          docker build -f Dockerfile.release -t parolnet-build --no-cache .
          docker run --rm -v $(pwd)/dist:/out parolnet-build
      - name: Display checksums
        run: cat dist/SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
