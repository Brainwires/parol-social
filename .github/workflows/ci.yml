name: CI

# PROBE BRANCH (never merged): the m1 cap-recovery figures on engine commits of the
# congestion owner's bisect. ParolNet code unchanged; `upto` builds it with the NACK
# responder limited UpToTarget instead of the engine default. Only this job runs here.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  recovery:
    name: m1 recovery @ ${{ matrix.rev }} ${{ matrix.upto && 'UpToTarget' || 'default' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rev: 53a17d35d07c9ea77582026a0c4e4e70076f3ee9
            upto: false
          - rev: 53a17d35d07c9ea77582026a0c4e4e70076f3ee9
            upto: true
          - rev: 4983efcc641bfd4db25a38c576e16525b5a18176
            upto: false
          - rev: df82663c6ca0a346e485b6ea79025c793a43f9a8
            upto: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-probe-recovery-${{ matrix.rev }}-${{ matrix.upto }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Pin the engine to ${{ matrix.rev }}
        run: |
          sed -i -E 's|^rtc = \{ git = "([^"]+)", rev = "[0-9a-f]+" \}|rtc = { git = "\1", rev = "${{ matrix.rev }}" }|' Cargo.toml
          grep -q '${{ matrix.rev }}' Cargo.toml
          cargo update -p rtc
      - name: UpToTarget build switch
        if: ${{ matrix.upto }}
        run: echo "PAROLNET_PROBE_NACK_UP_TO_TARGET=1" >> "$GITHUB_ENV"
      - name: Cap comes and goes, run 1
        run: cargo test -p parolnet-simnet --test m1 -- --nocapture --exact the_estimate_follows_a_cap_that_comes_and_goes
      - name: Cap comes and goes, run 2
        if: ${{ !cancelled() }}
        run: cargo test -p parolnet-simnet --test m1 -- --nocapture --exact the_estimate_follows_a_cap_that_comes_and_goes
      - name: All m1 tests (figures)
        if: ${{ !cancelled() }}
        run: cargo test -p parolnet-simnet --test m1 -- --nocapture --test-threads=1
