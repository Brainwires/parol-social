name: CI

# PROBE BRANCH (never merged): targeted jobs only. (1) ParolNet's re-keying tests on engine
# conf/rekey-1-glare daa6c684, three runs each. (2) file_tamper repeated with debug logs, for a
# failure rate and the step that hangs.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rekey:
    name: re-keying @ daa6c684
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-probe-rekey-daa6c684
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Pin the engine to daa6c684
        run: |
          sed -i -E 's|^rtc = \{ git = "([^"]+)", rev = "[0-9a-f]+" \}|rtc = { git = "\1", rev = "daa6c68432487d830d3344b1ad3595fadd6c90ce" }|' Cargo.toml
          grep -q daa6c684 Cargo.toml
          cargo update -p rtc
      - name: Build
        run: cargo test -p parolnet-simnet --test m1 --no-run
      - name: Three runs of each re-keying test
        run: |
          fail=0
          for i in 1 2 3; do
            for t in srtp_re_keying_keeps_the_call srtp_re_keying_by_one_side_keeps_the_call; do
              if cargo test -q -p parolnet-simnet --test m1 -- --exact --nocapture "$t" > "out-$t-$i.txt" 2>&1; then
                echo "RESULT $t run $i: ok"
              else
                echo "RESULT $t run $i: FAILED"; fail=1
              fi
              grep -E '^figure|panicked|left:|right:|froze|played' "out-$t-$i.txt" || true
            done
          done
          exit $fail

  tamper:
    name: file_tamper x30 @ ${{ matrix.rev }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rev:
          - df82663c6ca0a346e485b6ea79025c793a43f9a8
          - daa6c68432487d830d3344b1ad3595fadd6c90ce
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-probe-tamper-${{ matrix.rev }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Pin the engine to ${{ matrix.rev }}
        run: |
          sed -i -E 's|^rtc = \{ git = "([^"]+)", rev = "[0-9a-f]+" \}|rtc = { git = "\1", rev = "${{ matrix.rev }}" }|' Cargo.toml
          grep -q '${{ matrix.rev }}' Cargo.toml
          cargo update -p rtc
      - name: Build
        run: cargo test -p parolnet-app --test file_tamper --no-run
      - name: 30 runs, three at a time (the workspace's tests run in parallel too)
        env:
          RUST_LOG: parolnet_app=debug,parolnet_rtc=debug,warn
        run: |
          run() { for i in $(seq "$1" 3 30); do
            start=$(date +%s)
            if cargo test -q -p parolnet-app --test file_tamper > "tamper-$i.txt" 2>&1; then
              echo "RESULT run $i: ok in $(( $(date +%s) - start )) s"
            else
              echo "RESULT run $i: FAILED in $(( $(date +%s) - start )) s"
            fi
          done; }
          run 1 & run 2 & run 3 & wait
          fails=$(grep -l "FAILED\|panicked" tamper-*.txt || true)
          echo "failed runs: ${fails:-none}"
          for f in $fails; do echo "===== $f"; grep -vE "rtc_|^\s*$" "$f" | tail -400; done
          test -z "$fails"
