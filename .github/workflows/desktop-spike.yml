name: Desktop spike (M0)

# The GPUI video spike on the five desktop targets: build, the media crate's tests with its
# device backends compiled in (libvpx, cpal, nokhwa), the media check (echo cancellation ERLE,
# a synthetic camera through libvpx), a headless decode check (VP8 + an Opus tone from headless
# Chromium through webrtc-rs-rtc), the desktop's call media against the headless bot
# (desktop-call.mjs), then a real window that shows the stream and a screenshot. Heavy, so it runs only by hand: dispatched, or once on a pull
# request by adding the `desktop-spike` label (a workflow file can be dispatched only once it is on
# the default branch).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    name: spike (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04 }
          - { label: macos-arm64, os: macos-15 }
          - { label: macos-x64, os: macos-15-intel }
          - { label: windows-x64, os: windows-2025, triplet: x64-windows-static-md }
          - { label: windows-arm64, os: windows-11-arm, triplet: arm64-windows-static-md }
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'desktop-spike'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v7

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang / libclang: bindgen generates the V4L2 binding (camera capture, nokhwa).
          sudo apt-get install -y --no-install-recommends \
            pkg-config libvpx-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers \
            clang libclang-dev \
            xvfb imagemagick
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which leaves
          # Chrome for Testing "No usable sandbox!"; allow them rather than run it unsandboxed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx pkgconf
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "libvpx:${{ matrix.triplet }}"

      - name: Perl for the vendored OpenSSL (Windows)
        # parolnet-store's SQLCipher links an OpenSSL libcrypto that openssl-src builds from
        # source. Its Configure needs a native Windows perl: Git Bash's own perl (first on PATH
        # in these steps) lacks the modules it uses.
        if: runner.os == 'Windows'
        run: |
          perl="C:/Strawberry/perl/bin/perl.exe"
          [ -f "$perl" ] || choco install strawberryperl -y --no-progress
          "$perl" -v | sed -n 2p
          echo "OPENSSL_SRC_PERL=$perl" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Chromium for the sender (puppeteer)
        run: npm ci --omit=dev
      - name: Native Chromium for the sender (Windows arm64)
        # Chrome for Testing has no Windows arm64 build, and puppeteer's x64 one under emulation
        # stalls on its first page (Network.enable timed out); use the image's arm64 browser.
        if: matrix.label == 'windows-arm64'
        run: |
          for p in "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
                   "/c/Program Files/Microsoft/Edge/Application/msedge.exe" \
                   "/c/Program Files/Google/Chrome/Application/chrome.exe"; do
            if [ -f "$p" ]; then
              echo "CHROME_PATH=$(cygpath -w "$p")" >> "$GITHUB_ENV"
              echo "sender browser: $p"
              file "$p" || true
              exit 0
            fi
          done
          echo "no native Chromium found on this image" >&2
          exit 1

      - name: Toolchain (apps/desktop/rust-toolchain.toml)
        working-directory: apps/desktop
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: ${{ matrix.label }}-desktop-spike-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-desktop-spike-

      - name: Build
        working-directory: apps/desktop
        run: cargo build --release --locked

      - name: Unit tests
        working-directory: apps/desktop
        run: cargo test --release --locked

      - name: Media crate tests (libvpx, camera and audio backends compiled in)
        # parolnet-media with the features the desktop enables: the VP8 round trip, pixel
        # conversion, camera mode selection, the echo-cancellation measurement. No device is
        # opened.
        working-directory: apps/desktop
        run: cargo test --release --locked -p parolnet-media

      - name: Media check (echo cancellation ERLE, synthetic camera through libvpx)
        run: |
          bin=apps/desktop/target/release/parolnet-desktop
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --media-check

      - name: Headless decode check
        run: |
          bin=apps/desktop/target/release/parolnet-desktop
          [ -f "$bin.exe" ] && bin="$bin.exe"
          apps/desktop/spike/ci-run.sh headless "$bin" spike-out

      - name: Call check against the bot (desktop call media, no window)
        # The relay and the bot come from the root workspace (its own toolchain pin).
        run: |
          cargo build --locked -p parolnet-relay-server --bin parolnet-relay -p parolnet-app --example bot
          bin=apps/desktop/target/release/parolnet-desktop
          [ -f "$bin.exe" ] && bin="$bin.exe"
          node apps/desktop/interop/desktop-call.mjs "$bin"

      - name: Window and screenshot (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            apps/desktop/spike/ci-run.sh window apps/desktop/target/release/parolnet-desktop spike-out
      - name: Window and screenshot
        if: runner.os != 'Linux'
        run: |
          bin=apps/desktop/target/release/parolnet-desktop
          [ -f "$bin.exe" ] && bin="$bin.exe"
          apps/desktop/spike/ci-run.sh window "$bin" spike-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-${{ matrix.label }}
          path: spike-out/
          if-no-files-found: warn
