<!doctype html>
<meta charset="utf-8">
<title>RTCPeerConnection.close() with media playing</title>
<!--
  No app code. Two peer connections in this page call each other with a camera and a
  microphone; each one's remote stream plays in a <video>. Then each is torn down in the
  order the query string names, and the page reports how long every step took. A step
  that never returns freezes the page: the last line logged names it.

    ?order=close-first    pc.close(), then track.stop(), then srcObject = null
    ?order=detach-first   pause + srcObject = null, then pc.close(), then track.stop()
    ?order=stop-first     track.stop(), then pc.close(), then srcObject = null
    ?order=deferred       pause + srcObject = null; a task later track.stop(); a task later pc.close()
    ?order=camera-only    no connection: a camera playing in an element, track.stop() while it plays
    &rounds=N             calls to make (default 1)
    &hold=1               also hold a second microphone capture for the whole page, as the flows do
-->
<video id="remote-a" autoplay playsinline></video>
<video id="remote-b" autoplay playsinline></video>
<video id="self-a" autoplay playsinline muted></video>
<video id="self-b" autoplay playsinline muted></video>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const order = q.get("order") || "close-first";
const rounds = Number(q.get("rounds") || 1);
const say = (text) => {
  console.log(`[repro] ${text}`);
  document.getElementById("out").textContent += text + "\n";
};
const task = () => new Promise((done) => setTimeout(done, 0));
const timed = (name, fn) => {
  say(`${name} >`);
  const t0 = performance.now();
  fn();
  say(`${name} < ${Math.round(performance.now() - t0)}ms`);
};
const playing = (video) =>
  new Promise((done) => {
    const check = () => (video.videoWidth > 0 && !video.paused ? done() : setTimeout(check, 50));
    check();
  });

// No connection at all: a camera playing in an element, stopped while it plays.
async function cameraOnly(round) {
  const local = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  const self = document.getElementById("self-a");
  self.srcObject = local;
  self.play().catch(() => {});
  await playing(self);
  await new Promise((done) => setTimeout(done, 500));
  say(`round ${round}: camera playing, stopping it (${order})`);
  for (const track of local.getTracks()) timed(`${track.kind} track.stop()`, () => track.stop());
  await task();
  timed("self-a srcObject = null", () => (self.srcObject = null));
  say(`round ${round}: done`);
}

async function call(round) {
  const sides = [];
  for (const name of ["a", "b"]) {
    const local = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: true,
    });
    const pc = new RTCPeerConnection();
    for (const track of local.getTracks()) pc.addTrack(track, local);
    const remote = document.getElementById(`remote-${name}`);
    const self = document.getElementById(`self-${name}`);
    pc.ontrack = (ev) => {
      if (remote.srcObject !== ev.streams[0]) {
        remote.srcObject = ev.streams[0];
        remote.play().catch(() => {});
      }
    };
    self.srcObject = local;
    self.play().catch(() => {});
    sides.push({ name, pc, local, remote, self });
  }
  const [a, b] = sides;
  a.pc.onicecandidate = (ev) => ev.candidate && b.pc.addIceCandidate(ev.candidate).catch(() => {});
  b.pc.onicecandidate = (ev) => ev.candidate && a.pc.addIceCandidate(ev.candidate).catch(() => {});
  await a.pc.setLocalDescription(await a.pc.createOffer());
  await b.pc.setRemoteDescription(a.pc.localDescription);
  await b.pc.setLocalDescription(await b.pc.createAnswer());
  await a.pc.setRemoteDescription(b.pc.localDescription);
  await Promise.all([playing(a.remote), playing(b.remote)]);
  await new Promise((done) => setTimeout(done, 500));
  say(`round ${round}: media playing both ways, tearing down (${order})`);

  const detach = (s) => {
    for (const video of [s.remote, s.self]) {
      timed(`${s.name} ${video.id} pause`, () => video.pause());
      timed(
        `${s.name} ${video.id} srcObject = null`,
        () => (video.srcObject = null),
      );
    }
  };
  const stop = (s) => {
    for (const track of s.local.getTracks()) {
      timed(`${s.name} ${track.kind} track.stop()`, () => track.stop());
    }
  };
  const close = (s) => timed(`${s.name} pc.close()`, () => s.pc.close());
  for (const s of sides) {
    if (order === "close-first") {
      close(s);
      stop(s);
      await task();
      detach(s);
    } else if (order === "detach-first") {
      detach(s);
      close(s);
      stop(s);
    } else if (order === "stop-first") {
      stop(s);
      close(s);
      await task();
      detach(s);
    } else {
      detach(s);
      await task();
      stop(s);
      await task();
      close(s);
    }
  }
  say(`round ${round}: done`);
}

(async () => {
  try {
    if (q.get("hold") === "1") {
      window.__held = await navigator.mediaDevices.getUserMedia({
        audio: true,
      });
    }
    for (let round = 1; round <= rounds; round++) {
      await (order === "camera-only" ? cameraOnly(round) : call(round));
    }
    say("ALL DONE");
  } catch (error) {
    say(`FAILED ${error}`);
  }
})();
</script>
