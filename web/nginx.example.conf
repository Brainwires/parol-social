# ParolNet web app: example nginx configuration for the static export (web/out).
#
# The app is served under /pwa/ (https://parol.social/pwa/). Copy web/out to /srv/parolnet/pwa
# and include the `location` blocks below in the site's `server { }`. Nothing here is specific
# to nginx: any static host that can send these headers and fall back to index.html will do.
#
# What matters:
#   1. the Content-Security-Policy header, on every response;
#   2. files named by content hash or version are cached forever, everything else is revalidated;
#   3. sw.js is never cached by HTTP, or an update could not reach the browser;
#   4. application/wasm for .wasm (streaming compilation needs it).

# http { } context -----------------------------------------------------------------------------

# nginx's stock mime.types has application/wasm and font/woff2 since 1.21/1.13; the web
# manifest needs adding.
types {
    application/manifest+json webmanifest;
}

# server { } context ---------------------------------------------------------------------------

# One definition, included in every location below (an `add_header` in a location replaces
# the ones inherited from the server block, so they are repeated through this variable set).
#
# script-src:  'wasm-unsafe-eval' lets the page compile the Rust core's WebAssembly; it does
#              not allow eval() or inline script. There is no 'unsafe-inline' anywhere.
# style-src:   'self' only. The app has no <style> element and no style attribute.
# connect-src: the relay WebSocket (wss:, and ws: for a relay on a LAN or localhost).
set $parolnet_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

location = /pwa {
    return 308 /pwa/;
}

# Content-hashed and versioned files: the name changes when the content does.
#   assets/<name>-<HASH8>.<ext>   the bundle (web/scripts/postexport.ts hashes the entry too)
#   wasm/<name>-<hash8>.(js|wasm) the Rust core (web/scripts/build-wasm.ts)
#   fonts/<name>-<version>.woff2  self-hosted fonts
location ~ "^/pwa/(assets/.+-[A-Z0-9]{8}\.[a-z0-9]+|wasm/.+-[0-9a-f]{8}\.(js|wasm)|fonts/.+\.woff2)$" {
    alias /srv/parolnet/pwa/$1;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $parolnet_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# The service worker: always revalidated. Its scope is its own directory, /pwa/, which needs
# no Service-Worker-Allowed header; the header is sent so the scope stays valid if the worker
# file is ever moved below it (for example to /pwa/assets/).
location = /pwa/sw.js {
    alias /srv/parolnet/pwa/sw.js;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/pwa/" always;
    add_header Content-Security-Policy $parolnet_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# The shell and every other unhashed file (index.html, manifest.webmanifest, wasm/manifest.json,
# icons, theme-boot.js): revalidated on every use. Routing is in the URL hash, so the only
# fallback needed is index.html for the directory itself and for stray extensionless paths.
location /pwa/ {
    alias /srv/parolnet/pwa/;
    index index.html;
    try_files $uri $uri/ /pwa/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $parolnet_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
}

# gzip (or brotli) for the text formats and wasm; woff2 and png are already compressed.
gzip on;
gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;
