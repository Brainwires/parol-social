[package]
name = "parolnet-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cryptographic primitives for ParolNet: X3DH, Double Ratchet, AEAD, deniable encryption"

[features]
