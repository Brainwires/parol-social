[package]
name = "parolnet-rtc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async driver for the sans-I/O webrtc-rs-rtc peer connection (native only)"

[dependencies]
rtc.workspace = true
bytes = "1.12"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
if-addrs = "0.15"

[features]
# A minimal in-process TURN server (UDP, long-term credentials) for tests: this crate's and
# parolnet-app's. Never enabled in a shipped build.
test-turn = []

[dev-dependencies]
parolnet-rtc = { path = ".", features = ["test-turn"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
