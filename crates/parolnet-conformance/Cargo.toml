[package]
name = "parolnet-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Spec-clause-pinned conformance test suite for PNP-001 through PNP-009."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
parolnet-clause = { path = "../parolnet-clause" }
parolnet-crypto = { workspace = true }
parolnet-protocol = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
hmac = "0.13"
hkdf = "0.13"

[dev-dependencies]
parolnet-clause = { path = "../parolnet-clause" }
# `test-hooks`: state near a counter limit without 2^16 sends (PNP-009-MUST-078 to MUST-081).
parolnet-crypto = { workspace = true, features = ["test-hooks"] }
parolnet-protocol = { workspace = true }
parolnet-transport = { workspace = true }
parolnet-mesh = { workspace = true }
parolnet-relay = { workspace = true }
parolnet-relay-server = { path = "../parolnet-relay-server" }
parolnet-core = { workspace = true, features = ["native", "mesh"] }
# The native client's ICE policy and re-probing (PNP-001 §10.5, MUST-082 / SHOULD-019).
parolnet-app = { workspace = true }
parolnet-rtc = { workspace = true }
# PNP-010 file transfer.
parolnet-transfer = { workspace = true }
zeroize = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
# The black-box harness (tests/common): a scripted peer on the relay and on a data channel.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# The mock guard connection of the PNP-004 counter tests implements `Connection`.
async-trait = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
sha1 = { workspace = true }
voprf = { workspace = true }
curve25519-dalek = { workspace = true }
