[package]
name = "parolnet-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless ParolNet client core: identity, contacts, pairing, signaling, direct data channels, 1:1 chat and calls (native)"

[features]
# The OS keychain as the home of the store's key (`KeyStorage::Keychain`). The desktop app
# turns it on; headless builds (the bot, CI) keep the key-file provider and leave it off.
keychain = ["parolnet-store/keychain"]
# Fault injection for this crate's own integration tests (a record corrupted in flight).
# Never enabled in a shipped build.
test-hooks = []

[dependencies]
# Default features off: no mesh, no audio codecs, no transport stack. The app talks to the
# relay's signaling-only profile and carries content on WebRTC data channels.
parolnet-core = { workspace = true }
parolnet-crypto.workspace = true
parolnet-protocol.workspace = true
parolnet-rtc.workspace = true
parolnet-store.workspace = true
parolnet-transfer.workspace = true
bytes = "1.12"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots-no-provider"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
zeroize.workspace = true
# The pairing code as a QR code (level M, PNP-003-MUST-008). No image or SVG back ends.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# The in-process TURN server that stands in for the user's own.
parolnet-rtc = { workspace = true, features = ["test-turn"] }
parolnet-app = { path = ".", features = ["test-hooks"] }
sha2.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# The bot example's call audio (a tone, Opus-encoded in pure Rust; the M0 interop pin).
opus-rs = "=0.1.42"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
