[package]
name = "parolnet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ParolNet client library: session management, bootstrap, panic wipe, decoy mode"

[features]
default = ["native", "mesh"]
native = ["parolnet-transport", "parolnet-relay", "tokio", "tracing-subscriber", "opus-rs"]
# Store-forward and LAN discovery (parolnet-mesh). Optional: the desktop client builds without
# it until M4 (plan section 1).
mesh = ["native", "dep:parolnet-mesh"]
# Codec2 is LGPL-2.1 and fails the licence gate (deny.toml). Opt-in only until PNP-011
# removes it from the protocol in M1.
codec2 = ["dep:codec2"]
wasm = ["js-sys"]

[dependencies]
parolnet-crypto.workspace = true
parolnet-protocol.workspace = true
parolnet-transport = { workspace = true, optional = true }
parolnet-mesh = { workspace = true, optional = true }
parolnet-relay = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
async-trait.workspace = true
ciborium.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
rand_core.workspace = true
serde_json.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
serde_bytes.workspace = true
# PNP-003: the mDNS TXT record of a discovery announcement is base64; pre-key signatures.
base64.workspace = true
ed25519-dalek.workspace = true
# web-time removed — it pulls in performance.now() which breaks WASM instantiation
opus-rs = { workspace = true, optional = true }
codec2 = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
tokio-test.workspace = true
x25519-dalek.workspace = true
hex.workspace = true
ciborium.workspace = true
parolnet-crypto.workspace = true
parolnet-protocol.workspace = true
parolnet-transport.workspace = true
parolnet-relay.workspace = true
