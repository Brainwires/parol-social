[package]
name = "parolnet-simnet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test-only: a deterministic in-memory network (loss, jitter, reordering, a rate cap) that runs parolnet-rtc in virtual time, and the call scenarios checked on it"
publish = false

[features]
# The video scenarios with the real encoder: the test pattern through the system's libvpx
# (as the desktop app sends it) instead of the model encoder. Needs libvpx installed.
vpx = ["parolnet-media/vpx"]

[dependencies]
parolnet-rtc.workspace = true
# Default features only (pure Rust): the tone, Opus, the playout buffer.
parolnet-media = { workspace = true, features = ["opus"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
bytes = "1.12"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# The record stream of PNP-010, for the transfer that crosses an ICE restart.
parolnet-transfer.workspace = true
