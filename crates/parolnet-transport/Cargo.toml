[package]
name = "parolnet-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pluggable transports for ParolNet: TLS streams, WebSocket, traffic shaping, DPI evasion"

[dependencies]
parolnet-crypto.workspace = true
parolnet-protocol.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
tokio-tungstenite.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
ciborium.workspace = true
# HTTP/2 framing of the TLS transport (PNP-006 §5.3).
h2 = "0.4"
http = "1"
bytes = "1"
# TCP keepalive (PNP-006-MUST-027).
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio-test.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
