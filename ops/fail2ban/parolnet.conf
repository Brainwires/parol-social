# parol.social abuse log (nginx log_format parolnet_abuse: "<client> - [time] "METHOD /path PROTO" status ...").
[Definition]
# Rate- or connection-limited (429), refused (403: banned, relay tokens), malformed (400).
failregex = ^<HOST> - \[[^\]]*\] "[A-Z]+ [^"]*" (?:429|403|400) 
# Scanners probing for files a static PWA never serves.
            ^<HOST> - \[[^\]]*\] "[A-Z]+ /(?:\.env|\.git|wp-|wordpress|phpmyadmin|admin\.php|xmlrpc\.php|cgi-bin|vendor/|\.aws|server-status)
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
