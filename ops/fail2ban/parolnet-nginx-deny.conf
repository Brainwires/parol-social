# Bans for traffic that arrives through the Cloudflare tunnel: a host firewall rule would block cloudflared itself, so
# the ban goes into an nginx geo map (/etc/parolnet/banned/fail2ban.conf, mounted into parolnet-parolnet-1) and nginx
# reloads. nginx answers a banned client 403.
[Definition]
actionstart = touch /etc/parolnet/banned/fail2ban.conf
actionstop  = : > /etc/parolnet/banned/fail2ban.conf && docker exec parolnet-parolnet-1 nginx -s reload || true
actioncheck =
allowipv6 = auto
actionban   = grep -qxF '<ip> 1;' /etc/parolnet/banned/fail2ban.conf || echo '<ip> 1;' >> /etc/parolnet/banned/fail2ban.conf; docker exec parolnet-parolnet-1 nginx -s reload || true
actionunban = sed -i '\#^<ip> 1;$#d' /etc/parolnet/banned/fail2ban.conf; docker exec parolnet-parolnet-1 nginx -s reload || true
