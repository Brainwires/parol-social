# Relay profile (SIGNALING_ONLY=0): the entrypoint installs this config in place
# of nginx.conf. It proxies the relay-profile endpoints (token issuance,
# telemetry, endorsement, directory push, federation link, stats, bridge info)
# that the default signaling-only config closes. See nginx.conf for the client
# address map; the same caveat about a forgeable CF-Connecting-IP applies.
map $http_cf_connecting_ip $parolnet_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_conn_zone $parolnet_client_ip zone=ws:10m;
limit_req_zone $parolnet_client_ip zone=api:10m rate=5r/s;
# Abuse log for fail2ban: the client address, method, path WITHOUT the query
# string (PeerIds must never be logged), status, size, time, user agent. No
# other access log is written.
log_format parolnet_abuse '$parolnet_client_ip - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent rt=$request_time "$http_user_agent"';
# Bans: one "<ip> 1;" line per banned client in /etc/nginx/banned/*.conf,
# written by the host's fail2ban action (ops/fail2ban). An operator without
# fail2ban leaves the directory empty. Bans live in nginx, not the host
# firewall, because traffic arrives through the Cloudflare tunnel: a firewall
# ban would block cloudflared itself.
geo $parolnet_client_ip $parolnet_banned {
    default 0;
    include /etc/nginx/banned/*.conf;
}

server {
    listen 80;
    access_log /var/log/nginx/parolnet/access.log parolnet_abuse;
    limit_req_status 429;
    limit_conn_status 429;
    if ($parolnet_banned) { return 403; }
    server_name _;

    include /etc/nginx/mime.types;
    # The stock mime.types has application/wasm; the web manifest needs adding.
    types {
        application/manifest+json webmanifest;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a relative Location: behind the tunnel nginx sees plain http on port 80.
    absolute_redirect off;

    # Security headers (CSP among them), on every response. A location with an add_header of
    # its own must include this file again: nginx drops inherited add_header directives there.
    include /etc/nginx/snippets/parolnet-security-headers.conf;

    # No caching for the landing pages and the relay's answers. The web app under /pwa/ sets
    # its own cache rules below.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;

    # ── The web app (web/out) at /pwa/ ─────────────────────────────────────────────
    # Routing is in the URL hash, so the only fallback is /pwa/ -> /pwa/index.html (index);
    # a missing file is a 404, never the shell. `expires off` drops the server-level Expires
    # so each location's Cache-Control is the only cache rule.
    location = /pwa {
        return 308 /pwa/;
    }

    # Content-hashed and versioned files: the name changes when the content does.
    #   assets/<name>-<HASH8>.<ext>    the bundle (web/scripts/postexport.ts hashes the entry too)
    #   wasm/<name>-<hash8>.(js|wasm)  the Rust core (web/scripts/build-wasm.ts)
    #   fonts/<name>-<version>.woff2   self-hosted fonts
    location ~ "^/pwa/(assets/.+-[A-Z0-9]{8}\.[a-z0-9]+|wasm/.+-[0-9a-f]{8}\.(js|wasm)|fonts/.+-[0-9]+\.[0-9]+\.[0-9]+\.woff2)$" {
        expires off;
        include /etc/nginx/snippets/parolnet-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker: never cached by HTTP, or an update could not reach the browser. It
    # takes over from the previous PWA's worker at this same URL and scope.
    location = /pwa/sw.js {
        expires off;
        include /etc/nginx/snippets/parolnet-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/pwa/" always;
    }

    # The shell and every unhashed file (index.html, manifest.webmanifest, wasm/manifest.json,
    # icons, theme-boot.js, licences.txt): revalidated on every use.
    location /pwa/ {
        expires off;
        include /etc/nginx/snippets/parolnet-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Gzip
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;
    gzip_min_length 256;

    # WebSocket proxy to relay server
    location /ws {
        proxy_pass http://127.0.0.1:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
        limit_conn ws 8;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check for relay
    location /health {
        proxy_pass http://127.0.0.1:9000/health;
    }

    # Analytics stats endpoint
    location /stats {
        proxy_pass http://127.0.0.1:9000/stats;
    }

    # Telemetry endpoint
    location /telemetry {
        proxy_pass http://127.0.0.1:9000/telemetry;
        proxy_set_header Content-Type $content_type;
    }

    # Peer discovery endpoints
    location /peers {
        proxy_pass http://127.0.0.1:9000/peers;
    }

    location /bootstrap {
        proxy_pass http://127.0.0.1:9000/bootstrap;
    }

    # Relay directory & federation
    location /directory {
        proxy_pass http://127.0.0.1:9000/directory;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
    }

    # Authority endorsement
    location /endorse {
        proxy_pass http://127.0.0.1:9000/endorse;
        proxy_set_header Content-Type $content_type;
    }

    # Signed directory push (POST)
    location /directory/push {
        proxy_pass http://127.0.0.1:9000/directory/push;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
    }

    # Privacy Pass token minting (POST)
    location /tokens/issue {
        limit_req zone=api burst=20;
        proxy_pass http://127.0.0.1:9000/tokens/issue;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
    }

    # H12 Phase 2 presence + lookup (GET). The relay answers only requests
    # signed for it (Authorization: PNP-Ed25519 ..., PNP-008 §10.8): presence
    # to the federation peers in FEDERATION_PEER_KEYS, lookup to them and to
    # peers registered on it. nginx passes the Authorization header through.
    location /peers/presence {
        proxy_pass http://127.0.0.1:9000/peers/presence;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
    }

    location /peers/lookup {
        proxy_pass http://127.0.0.1:9000/peers/lookup;
        proxy_set_header X-Forwarded-For $parolnet_client_ip;
    }

    # H12 Phase 3 federation link (WebSocket upgrade, PNP-008-MUST-077).
    # Peer identity is established by the PNP-002 handshake inside the WSS
    # stream (MUST-018) — no HTTP-layer identity header is forwarded.
    location /federation/v1 {
        proxy_pass http://127.0.0.1:9000/federation/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # TURN credentials for WebRTC privacy
    location /turn-credentials {
        proxy_pass http://127.0.0.1:9000/turn-credentials;
    }

    # Bridge relay info
    location /bridge-info {
        proxy_pass http://127.0.0.1:9000/bridge-info;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
