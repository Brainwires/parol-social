# Security headers for every response. Installed as
# /etc/nginx/snippets/parolnet-security-headers.conf and included by nginx.conf and
# nginx.relay.conf in the server block AND in every location that has an add_header of its
# own: nginx drops the inherited add_header directives in a location that sets any.
#
# Content-Security-Policy: the web app's policy (web/nginx.example.conf), and the landing pages
# comply with it too (no inline script or style).
#   script-src  'wasm-unsafe-eval' lets the app compile the Rust core's WebAssembly; it does not
#               allow eval() or inline script. No 'unsafe-inline' anywhere.
#   connect-src 'self' is the relay at this origin (wss://<host>/ws); wss: and ws: are for a
#               person who names another relay under Settings, Advanced.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer" always;
# Calls and screen share need the camera, the microphone and display capture (same origin only).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
