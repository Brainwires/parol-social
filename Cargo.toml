[workspace]
resolver = "2"
members = [
    "crates/parolnet-crypto",
    "crates/parolnet-protocol",
    "crates/parolnet-transport",
    "crates/parolnet-mesh",
    "crates/parolnet-relay",
    "crates/parolnet-core",
    "crates/parolnet-wasm",
    "crates/parolnet-relay-server",
    "crates/parolnet-authority-cli",
    "crates/parolnet-cli",
    "crates/parolnet-clause",
    "crates/parolnet-conformance",
    "crates/parolnet-rtc",
    "crates/parolnet-store",
    "crates/parolnet-app",
    "crates/parolnet-media",
    "crates/parolnet-transfer",
    "crates/parolnet-simnet",
    "xtask",
]
# The GPUI desktop app is its own workspace: it needs a newer toolchain than the MSRV here and
# system libraries (libvpx, X11 / Wayland headers) the rest of the workspace does not.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
# Workspace internal
parolnet-crypto = { path = "crates/parolnet-crypto" }
parolnet-protocol = { path = "crates/parolnet-protocol" }
parolnet-transport = { path = "crates/parolnet-transport" }
parolnet-mesh = { path = "crates/parolnet-mesh" }
parolnet-relay = { path = "crates/parolnet-relay" }
parolnet-core = { path = "crates/parolnet-core", default-features = false }
parolnet-rtc = { path = "crates/parolnet-rtc" }
parolnet-app = { path = "crates/parolnet-app" }
parolnet-store = { path = "crates/parolnet-store" }
parolnet-media = { path = "crates/parolnet-media", default-features = false }
parolnet-transfer = { path = "crates/parolnet-transfer" }

# Realtime engine: `rtci`, Brainwires' fork of webrtc-rs/rtc (sans-I/O), renamed from `rtc`.
# Its DTLS / SRTP provider is ring (C and assembly); the E2EE layer stays pure Rust.
# Released on crates.io; the exact version is pinned in Cargo.lock.
rtci = "0.1.0"

# Crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
# Passphrase stretching (Argon2id) for the web app's passphrase lock and backup files.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Serialization
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# Multicast socket options for mDNS discovery (PNP-005 §5.9).
socket2 = { version = "0.6", features = ["all"] }

# Async / Networking
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
webpki-roots = "1.0"
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"

# Error handling / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"

# WASM
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Web server
axum = "0.8"
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }

# Time (WASM-compatible)
web-time = "1"

# Utilities
curve25519-dalek = "4"
futures-util = "0.3"
hex = "0.4"

# Privacy Pass / VOPRF (H9 relay token auth — RFC 9578 / RFC 9497)
voprf = { version = "0.5", default-features = false, features = ["ristretto255-ciphersuite", "alloc"] }

# Audio codecs
opus-rs = "0.1"
codec2 = "0.3"

# HMAC-SHA1 for TURN REST API credentials
sha1 = "0.11"
base64 = "0.22"

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }

# DNS (PNP-008 §8.3 bootstrap)
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }

# Native persistence (parolnet-store): SQLite with SQLCipher; the crypto provider is chosen
# per target in crates/parolnet-store/Cargo.toml.
rusqlite = { version = "0.43", default-features = false, features = ["cache"] }
# OS keychain (macOS Keychain, Windows Credential Manager, Linux Secret Service over zbus).
keyring = "4"

# Testing
proptest = "1"
tokio-test = "0.4"
rcgen = "0.14"

# The gossip proof of work (PNP-005 §3.4) is 65 thousand SHA-256 blocks for an ordinary
# message and a million for a relay descriptor. Unoptimized, the tests that originate
# such messages take minutes; optimizing this one dependency in dev builds takes that
# down to seconds.
[profile.dev.package.sha2]
opt-level = 3
